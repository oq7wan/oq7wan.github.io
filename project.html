<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أقحوان | معرض المواطنة البيئية</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

:root{
  --green:#006400;--green2:#228b22;--light:#e8f5e9;--cream:#f7f3e8;
  --gold:#c9a227;--wood:#76553a;--dark:#10271b;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Tajawal,Arial,sans-serif;background:var(--dark);overflow:hidden}
button{font:inherit;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#b7d8c5 0 58%,#c9ba9d 58% 100%);cursor:grab;touch-action:pan-y}
#app:active{cursor:grabbing}
#room{position:absolute;inset:0;perspective:900px;perspective-origin:50% 48%;transition:transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);will-change:transform}
.floor{position:absolute;left:-20%;width:140%;height:70%;top:53%;
 background:repeating-linear-gradient(90deg,#bbaa8a 0 90px,#b3a17f 90px 92px);
 transform:rotateX(67deg);transform-origin:top center;box-shadow:inset 0 30px 60px #65563d55}
.ceiling{position:absolute;left:-20%;width:140%;height:70%;top:-55%;background:#eee9dd;
 transform:rotateX(-67deg);transform-origin:bottom center}
.back{position:absolute;left:8%;right:8%;top:13%;bottom:15%;background:#eee9dd;
 border:10px solid #d9d1c2;box-shadow:0 0 70px #173b2530}
.pillar{position:absolute;top:9%;bottom:12%;width:36px;
 background:linear-gradient(90deg,#18572f,#4c9462,#18572f);box-shadow:0 8px 30px #0002}
.p1{left:5%}.p2{right:5%}
.flag{position:absolute;top:16%;left:50%;transform:translateX(-50%);font-size:52px;filter:drop-shadow(0 5px 8px #0003)}

.header{position:fixed;z-index:20;top:16px;right:16px;left:16px;display:flex;
 justify-content:center;align-items:center;pointer-events:none}
.welcome-banner{background:#fffffff2;border:1px solid #dce8dd;border-radius:16px;padding:9px 20px;
 color:#174b29;box-shadow:0 7px 25px #0002;font-weight:800;font-size:16px;text-align:center}

.hotspot{position:absolute;z-index:8;cursor:pointer;transition:.25s;transform:translate(-50%,-50%);
 filter:drop-shadow(0 5px 8px #0004)}
.hotspot:hover{transform:translate(-50%,-50%) scale(1.07)}
.art{width:185px;height:225px;background:#d9d1bc;border:13px solid var(--wood);
 box-shadow:0 10px 28px #0003;display:grid;place-items:center;color:#315b3c;text-align:center;padding:10px}
.art .icon{font-size:52px}.art b{font-size:16px}.art small{font-size:11px}
.video{width:285px;height:175px;background:#101b15;border:12px solid #292d29;box-shadow:0 12px 35px #0006;
 display:grid;place-items:center;color:white;text-align:center}
.video .play{font-size:52px}
.plant{position:absolute;bottom:15%;font-size:80px;filter:drop-shadow(0 8px 7px #0003)}
.nav{position:fixed;z-index:30;bottom:16px;left:50%;transform:translateX(-50%);
 display:flex;gap:7px;max-width:94vw;overflow-x:auto;background:#0009;padding:8px;border-radius:18px;backdrop-filter:blur(8px)}
.nav button{border:0;border-radius:11px;background:#fff;color:#174b29;padding:9px 12px;font-weight:700;white-space:nowrap}
.nav button.active{background:#b9e6c1}
.help{position:fixed;z-index:25;bottom:76px;left:50%;transform:translateX(-50%);
 background:#0009;color:#fff;padding:7px 14px;border-radius:18px;font-size:12px}
.start{position:fixed;z-index:80;inset:0;display:grid;place-items:center;
 background:radial-gradient(circle at 50% 40%,#2d804b,#063018 75%);color:white}
.startbox{width:min(720px,92vw);padding:38px;text-align:center;border-radius:30px;background:#ffffff12;
 border:1px solid #ffffff30;box-shadow:0 25px 80px #0007;backdrop-filter:blur(14px)}
.logo{font-size:72px;line-height:1}.start h1{font-size:38px;margin:7px 0 4px}
.start h2{font-size:20px;font-weight:500;margin:0 0 16px;color:#d9f2df}
.start p{line-height:2;color:#edf8ef}.enter{border:0;background:#b9e6c1;color:#073d17;border-radius:15px;
 padding:13px 30px;font-weight:800;font-size:17px}
.school{display:inline-block;margin:8px auto 18px;padding:7px 16px;border:1px solid #ffffff44;
 border-radius:20px;background:#ffffff12;color:#fff}
.panel{position:fixed;z-index:60;inset:0;display:none;place-items:center;background:#000b;padding:18px}
.box{width:min(980px,95vw);max-height:90vh;overflow:auto;background:var(--cream);color:#183b25;
 border-radius:25px;padding:28px;box-shadow:0 20px 80px #0009}
.close{float:left;border:0;background:var(--green);color:#fff;border-radius:10px;padding:8px 15px}
.box h2{color:var(--green);margin-top:0;font-size:28px}.box p{line-height:2;font-size:17px}
.note{background:#e8f5e9;border-right:5px solid var(--green2);padding:15px;border-radius:12px;line-height:1.9}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gallery figure{margin:0;position:relative;cursor:pointer;overflow:hidden;border-radius:13px;background:#dcebdd}
.gallery img{display:block;width:100%;height:190px;object-fit:cover;transition:.3s}
.gallery figure:hover img{transform:scale(1.04)}
.gallery figcaption{padding:8px;text-align:center;font-weight:700;background:#fff}
video{width:100%;max-height:60vh;background:#111;border-radius:15px}
.pdf{width:100%;height:65vh;border:0;border-radius:14px;background:white}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 18px #0001;border-top:4px solid var(--green2)}
.card .big{font-size:40px}.card h3{margin:8px 0;color:var(--green)}
.lightbox{position:fixed;z-index:100;inset:0;display:none;place-items:center;background:#000e;padding:25px}
.lightbox img{max-width:94vw;max-height:86vh;object-fit:contain;border-radius:12px;box-shadow:0 20px 70px #000}
.lightbox button{position:absolute;top:20px;left:20px;border:0;border-radius:12px;background:#fff;
 color:var(--green);font-size:22px;width:45px;height:45px}
.footerlink{margin-top:20px;display:inline-block;background:var(--green);color:#fff;text-decoration:none;
 padding:10px 18px;border-radius:11px}
@media(max-width:700px){
 .art{width:125px;height:155px;border-width:9px}.video{width:190px;height:125px}
 .gallery{grid-template-columns:1fr}.cards{grid-template-columns:1fr}
 .help{display:none}.welcome-banner{font-size:13px;padding:7px 14px}
 .start h1{font-size:28px}.startbox{padding:28px 20px}
 .art .icon{font-size:38px}.art b{font-size:13px}
}

.student-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0 20px}
.student-search{flex:1;min-width:220px;border:2px solid #d8e7da;border-radius:12px;padding:11px 14px;font:inherit;background:#fff}
.student-count{background:#e8f5e9;color:#17632b;border-radius:12px;padding:10px 14px;font-weight:800}
.students-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.student-card{background:#fff;border-radius:16px;padding:15px;text-align:center;box-shadow:0 5px 18px #0001;
 border:1px solid #e2ece3;border-top:4px solid var(--green2);transition:.2s;cursor:pointer}
.student-card:hover{transform:translateY(-4px);box-shadow:0 10px 25px #0002}
.student-avatar{width:62px;height:62px;margin:auto;border-radius:50%;display:grid;place-items:center;
 background:#e8f5e9;font-size:30px}
.student-card h3{margin:8px 0 5px;color:var(--green)}
.student-stats{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;font-size:11px;color:#567}
.student-stats span{background:#f1f6f1;border-radius:20px;padding:4px 7px}
.student-detail-head{display:flex;align-items:center;gap:15px;background:#e8f5e9;border-radius:16px;padding:15px;margin-bottom:18px}
.student-detail-avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:36px}
.work-section{margin:18px 0;padding:17px;background:#
